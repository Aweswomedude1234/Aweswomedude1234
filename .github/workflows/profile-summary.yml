name: Generate profile contribution summary

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          USERNAME: Aweswomedude1234
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output || true
          git diff --cached --quiet || git commit -m "Update profile summary cards"
          git push || true
